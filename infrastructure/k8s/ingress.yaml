# Wildcard ingress for user apps: <app>.cloudforge.is-a.dev
# Applied per-app by the control plane when a new project is deployed.
# This is the template — control plane generates one per project.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app-PLACEHOLDER
  namespace: user-apps
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  tls:
    - hosts:
        - PLACEHOLDER.cloudforge.is-a.dev
      secretName: app-PLACEHOLDER-tls
  rules:
    - host: PLACEHOLDER.cloudforge.is-a.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app-PLACEHOLDER
                port:
                  number: 80
