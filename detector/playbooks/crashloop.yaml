name: crashloop
description: Pod restart count exceeds threshold or spikes (z-score) — redeploy app

trigger:
  threshold: 5      # hard trigger: >=5 restarts
  zscore: 3.0       # or z-score spike vs rolling 10-min baseline

action:
  type: redeploy
  app: cloudforge
  project_id: "49642124-b57a-43f9-8dfa-57f835392f5d"
  image: "ghcr.io/gauravsingh096/cloudforge-control-plane:latest"
