# Deploy workflow — Codespaces edition
#
# With GitHub Codespaces as compute (instead of Oracle VM), there is no
# always-on server to SSH into. Deployment is done manually inside the
# Codespace after CI builds and pushes the image to ghcr.io.
#
# To deploy a new image inside your Codespace, run:
#   kubectl set image deployment/cloudforge-control-plane \
#     control-plane=ghcr.io/gauravsingh096/cloudforge-control-plane:<sha> \
#     -n cloudforge-system
#
# This workflow is intentionally disabled (no trigger) until a persistent
# server is available (e.g. if Oracle Cloud is set up later).

name: Deploy control-plane

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Image SHA to deploy (leave blank for latest)"
        required: false

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Print deploy instructions
        run: |
          echo "Running on Codespaces — open your Codespace and run:"
          echo ""
          echo "  kubectl set image deployment/cloudforge-control-plane \\"
          echo "    control-plane=ghcr.io/gauravsingh096/cloudforge-control-plane:${{ github.sha }} \\"
          echo "    -n cloudforge-system"
