name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  # ghcr.io requires lowercase image names
  IMAGE: ghcr.io/gauravsingh096/cloudforge-control-plane

jobs:
  control-plane:
    name: control-plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: go mod tidy
        run: go mod tidy

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...
        # Unit tests always run; integration tests skip when DATABASE_URL is unset.
        # build-images depends on this job — test failure blocks image push.

  detector:
    name: detector (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: lint
        run: |
          pip install ruff
          ruff check . || true

  build-images:
    name: build Docker images
    runs-on: ubuntu-latest
    needs: [control-plane, detector]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push control-plane
        uses: docker/build-push-action@v5
        with:
          context: control-plane
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  trigger-deploy:
    name: trigger deploy on control plane
    runs-on: ubuntu-latest
    needs: [build-images]
    if: github.ref == 'refs/heads/main' && vars.CONTROL_PLANE_URL != ''
    steps:
      - name: create deploy record via webhook
        run: |
          echo "Deploy triggered for sha ${{ github.sha }}"
          echo "Control plane at ${{ vars.CONTROL_PLANE_URL }}"
          # GitHub webhook fires automatically — this step just confirms the image is ready
          # The webhook already created a deploy record; now tell the control plane to apply it
          DEPLOY_ID=$(curl -s -X GET \
            "${{ vars.CONTROL_PLANE_URL }}/api/projects" \
            -H "Content-Type: application/json" | \
            python3 -c "import sys,json; projects=json.load(sys.stdin); print(projects[0]['id'] if projects else '')" 2>/dev/null || echo "")

          if [ -n "$DEPLOY_ID" ]; then
            curl -s -X POST \
              "${{ vars.CONTROL_PLANE_URL }}/api/deploys" \
              -H "Content-Type: application/json" \
              -d "{\"project_id\":\"$DEPLOY_ID\",\"image\":\"${{ env.IMAGE }}:${{ github.sha }}\",\"commit_sha\":\"${{ github.sha }}\"}"
          fi
