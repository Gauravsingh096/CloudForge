name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  control-plane:
    name: control-plane (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: control-plane/go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test
        run: go test ./...

  detector:
    name: detector (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: detector
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install deps
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: lint
        run: |
          pip install ruff
          ruff check . || true

  build-images:
    name: build Docker images
    runs-on: ubuntu-latest
    needs: [control-plane, detector]
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build and push control-plane
        uses: docker/build-push-action@v5
        with:
          context: control-plane
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/cloudforge-control-plane:latest
            ghcr.io/${{ github.repository_owner }}/cloudforge-control-plane:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
